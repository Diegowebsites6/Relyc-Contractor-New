<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  <meta name="author" content="{{LEGAL_NAME}}">
  <meta name="theme-color" content="#05070A">
  <link rel="canonical" href="{{CANONICAL}}">

  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <link rel="icon" href="assets/img/favicon.ico?v=3" sizes="48x48">
  <link rel="icon" href="assets/img/favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/img/favicon-16.png?v=3" type="image/png" sizes="16x16">
  <link rel="icon" href="assets/img/favicon-192.png?v=3" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=3">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preload" href="assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  {{PRELOAD}}
  <link rel="stylesheet" href="assets/css/main.css">

  <script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
  {{ANALYTICS}}
  {{JSONLD}}
</head>
<body class="{{BODY_CLASS}} is-loading">

{{PRELOADER}}

<a class="skip" href="#main">Skip to content</a>

{{HEADER}}

<main id="main">
{{CONTENT}}
</main>

{{FOOTER}}

<script src="assets/vendor/lenis.min.js" defer></script>
<script src="assets/vendor/gsap.min.js" defer></script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
<script src="assets/js/app.js" defer></script>
{{SCRIPTS}}
</body>
</html>
